<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="620" viewBox="0 0 1000 620" role="img"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Inside your laptop: OpenCode, the class Python sandbox and your ESP32 board over USB. In the cloud: OpenCode Console, which calls DeepSeek V4.1 Flash.</title>
  <!-- Icons from Lucide (lucide.dev), ISC licence. -->
  <rect width="1000" height="620" fill="#ffffff"/>

  <!-- ======================= on your laptop ======================= -->
  <rect x="24" y="56" width="576" height="528" rx="24" fill="#f7f9fc" stroke="#d5dce7" stroke-width="2"/>
  <g transform="translate(44, 76) scale(1.8)" fill="none" stroke="#0d1526" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 5a2 2 0 0 1 2 2v8.526a2 2 0 0 0 .212.897l1.068 2.127a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45l1.068-2.127A2 2 0 0 0 4 15.526V7a2 2 0 0 1 2-2z" />
      <path d="M20.054 15.987H3.946" />
  </g>
  <text x="110" y="103" font-size="22" font-weight="700" fill="#0d1526">On your laptop</text>

  <!-- the client: OpenCode -->
  <rect x="56" y="128" width="512" height="116" rx="14" fill="#ffffff" stroke="#bcd8f7" stroke-width="2"/>
  <g transform="translate(88, 150) scale(3.1)" fill="none" stroke="#3E8EDE" stroke-width="0.87" stroke-linecap="round" stroke-linejoin="round">
    <path d="m7 11 2-2-2-2" />
      <path d="M11 13h4" />
      <rect width="18" height="18" x="3" y="3" rx="2" ry="2" />
  </g>
  <text x="196" y="174" font-size="19" font-weight="700" fill="#0d1526">OpenCode Desktop</text>
  <text x="196" y="198" font-size="13.5" fill="#5f6b7a">the app you type in, and where the answers appear</text>

  <!-- the local Python sandbox -->
  <rect x="56" y="276" width="238" height="288" rx="14" fill="#fbf7f2" stroke="#e0d3c5" stroke-width="2"/>
  <g transform="translate(88, 300) scale(3.1)" fill="none" stroke="#63493A" stroke-width="0.87" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z" />
      <path d="m3.3 7 8.7 5 8.7-5" />
      <path d="M12 22V12" />
  </g>
  <text x="80" y="428" font-size="17" font-weight="700" fill="#3D2E25">The class Python</text>
  <text x="80" y="450" font-size="17" font-weight="700" fill="#3D2E25">sandbox</text>
  <text x="80" y="482" font-size="13" fill="#5f6b7a">The class skills run here,</text>
  <text x="80" y="500" font-size="13" fill="#5f6b7a">in their own environment,</text>
  <text x="80" y="518" font-size="13" fill="#5f6b7a">and upload code to the board.</text>
  <text x="80" y="546" font-size="12.5" fill="#63493A"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">~/.venvs/ent164-maker</text>

  <!-- the device: your ESP32, over USB -->
  <rect x="334" y="276" width="234" height="288" rx="14" fill="#ffffff" stroke="#d5dce7" stroke-width="2"/>
  <g transform="translate(366, 300) scale(3.1)" fill="none" stroke="#1e1e22" stroke-width="0.87" stroke-linecap="round" stroke-linejoin="round">
    <rect width="18" height="18" x="3" y="3" rx="2" />
      <path d="M11 9h4a2 2 0 0 0 2-2V3" />
      <circle cx="9" cy="9" r="2" />
      <path d="M7 21v-4a2 2 0 0 1 2-2h4" />
      <circle cx="15" cy="15" r="2" />
  </g>
  <text x="358" y="428" font-size="17" font-weight="700" fill="#0d1526">Your ESP32 board</text>
  <text x="358" y="452" font-size="13" fill="#5f6b7a">plugged in over USB.</text>
  <text x="358" y="484" font-size="13" fill="#5f6b7a">MicroPython arrives here,</text>
  <text x="358" y="502" font-size="13" fill="#5f6b7a">and the skills talk to it</text>
  <text x="358" y="520" font-size="13" fill="#5f6b7a">over the USB cable.</text>

  <!-- the links out of the app, and from the sandbox to the board -->
  <g stroke="#3E8EDE" stroke-width="3" fill="#3E8EDE">
    <line x1="179" y1="244" x2="179" y2="270"/>
    <path d="M173 268 L179 278 L185 268 Z"/>
    <line x1="447" y1="244" x2="447" y2="270"/>
    <path d="M441 268 L447 278 L453 268 Z"/>
    <line x1="300" y1="420" x2="326" y2="420"/>
    <path d="M324 414 L334 420 L324 426 Z"/>
  </g>
  <rect x="428" y="250" width="38" height="18" rx="9" fill="#ffffff" stroke="#bcd8f7" stroke-width="1.5"/>
  <text x="447" y="263" font-size="11" fill="#1F6FD0" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">USB</text>

  <!-- ======================= in the cloud ======================= -->
  <rect x="660" y="56" width="316" height="528" rx="24" fill="#f7f9fc" stroke="#3E8EDE" stroke-width="2" stroke-dasharray="10 7"/>
  <g transform="translate(682, 78) scale(1.8)" fill="none" stroke="#3E8EDE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" />
  </g>
  <text x="764" y="103" font-size="22" font-weight="700" fill="#0d1526">In the cloud</text>

  <!-- the service -->
  <rect x="684" y="140" width="268" height="150" rx="14" fill="#ffffff" stroke="#bcd8f7" stroke-width="2"/>
  <g transform="translate(702, 168) scale(3.1)" fill="none" stroke="#1F6FD0" stroke-width="0.87" stroke-linecap="round" stroke-linejoin="round">
    <rect width="20" height="8" x="2" y="2" rx="2" ry="2" />
      <rect width="20" height="8" x="2" y="14" rx="2" ry="2" />
      <line x1="6" x2="6.01" y1="6" y2="6" />
      <line x1="6" x2="6.01" y1="18" y2="18" />
  </g>
  <text x="788" y="188" font-size="17" font-weight="700" fill="#0d1526">OpenCode Console</text>
  <text x="788" y="212" font-size="13" fill="#5f6b7a">the service that holds</text>
  <text x="788" y="230" font-size="13" fill="#5f6b7a">your class account</text>

  <g stroke="#1F6FD0" stroke-width="3" fill="#1F6FD0">
    <line x1="818" y1="290" x2="818" y2="332"/>
    <path d="M812 330 L818 340 L824 330 Z"/>
  </g>
  <text x="832" y="320" font-size="12.5" fill="#5f6b7a">calls</text>

  <!-- the model -->
  <rect x="684" y="340" width="268" height="150" rx="14" fill="#ffffff" stroke="#c3ccdd" stroke-width="2"/>
  <g transform="translate(706, 368) scale(3.1)" fill="none" stroke="#002E6D" stroke-width="0.87" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z" />
      <path d="M20 2v4" />
      <path d="M22 4h-4" />
      <circle cx="4" cy="20" r="2" />
  </g>
  <text x="788" y="388" font-size="17" font-weight="700" fill="#0d1526">DeepSeek V4.1 Flash</text>
  <text x="788" y="412" font-size="13" fill="#5f6b7a">the model that writes</text>
  <text x="788" y="430" font-size="13" fill="#5f6b7a">the answers</text>

  <!-- ======================= the link between them ======================= -->
  <g stroke="#3E8EDE" stroke-width="3" fill="#3E8EDE">
    <line x1="608" y1="330" x2="652" y2="330"/>
    <path d="M608 324 L598 330 L608 336 Z"/>
    <path d="M652 324 L662 330 L652 336 Z"/>
  </g>
  <text x="630" y="306" font-size="11.5" fill="#1F6FD0" text-anchor="middle">your class</text>
  <text x="630" y="320" font-size="11.5" fill="#1F6FD0" text-anchor="middle">account</text>
  <!-- animated data-flow pulses along the connectors -->
  <style>@media print { .flow { display: none; } }</style>
  <defs>
    <path id="flow-out" d="M592 330 H664"/>
    <path id="flow-back" d="M664 330 H592"/>
    <path id="flow-call" d="M818 288 V342"/>
    <path id="flow-reply" d="M818 342 V288"/>
    <path id="flow-app-sandbox" d="M179 242 V280"/>
    <path id="flow-sandbox-board" d="M298 420 H336"/>
  </defs>
  <g class="flow">
    <circle r="5.5" fill="#3E8EDE" opacity="0">
      <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.04;0.2;1"><mpath href="#flow-out" xlink:href="#flow-out"/></animateMotion>
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.03;0.06;0.18;0.21;1"/>
    </circle>
    <circle r="5.5" fill="#1F6FD0" opacity="0">
      <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.24;0.36;1"><mpath href="#flow-call" xlink:href="#flow-call"/></animateMotion>
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.23;0.26;0.34;0.37;1"/>
    </circle>
    <circle r="5.5" fill="#1F6FD0" opacity="0">
      <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.42;0.54;1"><mpath href="#flow-reply" xlink:href="#flow-reply"/></animateMotion>
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.41;0.44;0.52;0.55;1"/>
    </circle>
    <circle r="5.5" fill="#3E8EDE" opacity="0">
      <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.56;0.72;1"><mpath href="#flow-back" xlink:href="#flow-back"/></animateMotion>
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.55;0.58;0.7;0.73;1"/>
    </circle>
    <circle r="5.5" fill="#3E8EDE" opacity="0">
      <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.76;0.84;1"><mpath href="#flow-app-sandbox" xlink:href="#flow-app-sandbox"/></animateMotion>
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.75;0.775;0.825;0.85;1"/>
    </circle>
    <circle r="5.5" fill="#3E8EDE" opacity="0">
      <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.86;0.96;1"><mpath href="#flow-sandbox-board" xlink:href="#flow-sandbox-board"/></animateMotion>
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.85;0.875;0.945;0.97;1"/>
    </circle>
  </g>
</svg>
