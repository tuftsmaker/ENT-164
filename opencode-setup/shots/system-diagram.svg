<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="232" viewBox="0 0 1000 232" role="img">
  <title>You use OpenCode. OpenCode connects to OpenCode Console. Console calls DeepSeek V4.1 Flash.</title>
  <rect width="1000" height="232" fill="#ffffff"/>

  <!-- the three hops -->
  <g stroke="#3E8EDE" stroke-width="3" fill="#3E8EDE">
    <line x1="245" y1="110" x2="272" y2="110"/>
    <path d="M271 102 L283 110 L271 118 Z"/>
    <line x1="481" y1="110" x2="508" y2="110"/>
    <path d="M507 102 L519 110 L507 118 Z"/>
    <line x1="717" y1="110" x2="744" y2="110"/>
    <path d="M743 102 L755 110 L743 118 Z"/>
  </g>

  <!-- the four parts -->
  <g fill="#f7f9fc" stroke="#e6eaf1" stroke-width="2">
    <rect x="51" y="62" width="190" height="96" rx="14"/>
    <rect x="287" y="62" width="190" height="96" rx="14"/>
    <rect x="523" y="62" width="190" height="96" rx="14"/>
    <rect x="759" y="62" width="190" height="96" rx="14"/>
  </g>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="146" y="103" font-size="19" font-weight="700" fill="#0d1526">You</text>
    <text x="146" y="127" font-size="13.5" fill="#5f6b7a">at your computer</text>

    <text x="382" y="103" font-size="19" font-weight="700" fill="#0d1526">OpenCode</text>
    <text x="382" y="127" font-size="13.5" fill="#5f6b7a">the app</text>

    <text x="618" y="103" font-size="19" font-weight="700" fill="#0d1526">OpenCode Console</text>
    <text x="618" y="127" font-size="13.5" fill="#5f6b7a">the service</text>

    <text x="854" y="103" font-size="15.5" font-weight="700" fill="#0d1526">DeepSeek V4.1 Flash</text>
    <text x="854" y="127" font-size="13.5" fill="#5f6b7a">the model</text>

    <g font-size="11" fill="#5f6b7a">
      <text x="264" y="93">type</text>
      <text x="500" y="93">connect</text>
      <text x="736" y="93">ask</text>
    </g>
  </g>
</svg>
