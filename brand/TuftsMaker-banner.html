<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @page { size: 2048px 1152px; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { width: 2048px; height: 1152px; overflow: hidden; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    background: #f7f9fc;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }

  /* ---------- base canvas: light blue-grey like the site ---------- */
  .canvas {
    position: absolute; inset: 0;
    background:
      radial-gradient(1200px 700px at 50% 52%, #ffffff 0%, #f2f7fd 62%, #e7eef9 100%);
  }

  /* ---------- photo bands left + right (these get cropped away on mobile/TV) ---------- */
  .band { position: absolute; top: 0; bottom: 0; width: 540px; overflow: hidden; }
  /* opaque at the outer edge, fading into the white centre (no hard cut) */
  .band.left  { left: 0;  -webkit-mask-image: linear-gradient(to right, #000 0%, #000 42%, rgba(0,0,0,0) 100%); mask-image: linear-gradient(to right, #000 0%, #000 42%, rgba(0,0,0,0) 100%); }
  .band.right { right: 0; -webkit-mask-image: linear-gradient(to left,  #000 0%, #000 42%, rgba(0,0,0,0) 100%); mask-image: linear-gradient(to left,  #000 0%, #000 42%, rgba(0,0,0,0) 100%); }
  .band .strip { position: absolute; inset: 0; display: grid; grid-template-rows: repeat(4, 1fr); }
  .band .strip img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .band::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(247,249,252,.46), rgba(238,243,250,.30) 45%, rgba(230,238,249,.52));
  }

  /* ---------- soft colour washes ---------- */
  .wash { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .5; }
  .wash.a { width: 900px; height: 620px; left: -180px; top: 120px;  background: radial-gradient(circle, rgba(62,142,222,.40), rgba(62,142,222,0) 68%); }
  .wash.b { width: 880px; height: 600px; right: -160px; bottom: 60px; background: radial-gradient(circle, rgba(0,46,109,.22), rgba(0,46,109,0) 68%); }

  /* ---------- safe-zone guides for review (hidden in the final render) ---------- */
  .guides { position: absolute; inset: 0; display: none; }
  .guides.on { display: block; }
  .safe {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 1235px; height: 338px;
    border: 2px dashed rgba(31,111,208,.85);
  }
  .safe-label {
    position: absolute; top: -30px; left: 0;
    font-size: 20px; font-weight: 700; color: #1F6FD0; letter-spacing: .5px;
  }

  /* ---------- centred lockup (inside the 1235 x 338 safe zone) ---------- */
  .lockup {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 1235px; height: 338px;
    display: flex; align-items: center; justify-content: center; gap: 34px;
  }

  .mark {
    width: 132px; height: 132px; border-radius: 34px; flex: 0 0 auto;
    background: linear-gradient(145deg, #4c9ae6, #2f7cc9);
    display: grid; place-items: center;
    box-shadow: 0 14px 34px rgba(62,142,222,.34), inset 0 2px 0 rgba(255,255,255,.42);
  }
  .mark svg { width: 72px; height: 72px; }

  .words { display: flex; flex-direction: column; }
  .name {
    font-size: 118px; font-weight: 800; letter-spacing: -4px; line-height: .96;
    color: #0d1526;
  }
  .name .accent { color: #1F6FD0; }
  .tagline {
    margin-top: 14px;
    font-size: 34px; font-weight: 600; letter-spacing: 5px; text-transform: uppercase;
    color: #5f6b7a;
  }
  .tagline .dot { color: #3E8EDE; }
</style>
</head>
<body>
  <div class="canvas"></div>

  <div class="band left">
    <div class="strip">
      <img src="../assets/photos/class/band-robot-challenge.jpg" alt="">
      <img src="../assets/photos/class/laser-cut-clock.jpg" alt="">
      <img src="../assets/photos/class/laser-cut-projects.jpg" alt="">
      <img src="../assets/photos/class/breadboard-esp32.jpg" alt="">
    </div>
  </div>
  <div class="band right">
    <div class="strip">
      <img src="../assets/photos/class/printed-medallion.jpg" alt="">
      <img src="../assets/photos/class/student-builds.jpg" alt="">
      <img src="../assets/photos/class/pen-plotter.jpg" alt="">
      <img src="../assets/photos/class/foam-core-houses.jpg" alt="">
    </div>
  </div>

  <div class="wash a"></div>
  <div class="wash b"></div>

  <div class="lockup">
    <span class="mark" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m15 12-9.373 9.373a1 1 0 0 1-3.001-3L12 9" />
        <path d="m18 15 4-4" />
        <path d="m21.5 11.5-1.914-1.914A2 2 0 0 1 19 8.172v-.344a2 2 0 0 0-.586-1.414l-1.657-1.657A6 6 0 0 0 12.516 3H9l1.243 1.243A6 6 0 0 1 12 8.485V10l2 2h1.172a2 2 0 0 1 1.414.586L18.5 14.5" />
      </svg>
    </span>
    <div class="words">
      <div class="name">Tufts<span class="accent">Maker</span></div>
      <div class="tagline">Making things that work<span class="dot">.</span></div>
    </div>
  </div>

  <div class="guides" id="guides">
    <div class="safe"><span class="safe-label">1235 x 338 — visible on every device</span></div>
  </div>
</body>
</html>
