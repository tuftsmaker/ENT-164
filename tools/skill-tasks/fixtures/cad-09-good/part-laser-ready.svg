  <path id="cut-2" d="M 100,60 L 100,0" style="fill:none;stroke:#ff0000;stroke-opacity:1;stroke-linejoin:round;stroke-linecap:round;stroke-width:1px;vector-effect:non-scaling-stroke;-inkscape-stroke:hairline"/>
  <path id="cut-3" d="M 100,0 L 0,0" style="fill:none;stroke:#ff0000;stroke-opacity:1;stroke-linejoin:round;stroke-linecap:round;stroke-width:1px;vector-effect:non-scaling-stroke;-inkscape-stroke:hairline"/>
  <path id="cut-4" d="M 0,0 L 0,60" style="fill:none;stroke:#ff0000;stroke-opacity:1;stroke-linejoin:round;stroke-linecap:round;stroke-width:1px;vector-effect:non-scaling-stroke;-inkscape-stroke:hairline"/>
