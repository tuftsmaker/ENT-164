<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Client and server over the board's own WiFi: your phone joins the board's network and opens the page it serves — no router, no cloud — and the board drives the RGB LED.</title>
  <rect width="1200" height="560" fill="#ffffff"/>

  <!-- your phone -->
  <rect x="90" y="160" width="270" height="250" rx="18" fill="#ffffff" stroke="#e6eaf1" stroke-width="2.5"/>
  <g transform="translate(126,196) scale(2.2)" fill="none" stroke="#3E8EDE" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect width="14" height="20" x="5" y="2" rx="2" ry="2"/>
    <path d="M12 18h.01"/>
  </g>
  <text x="126" y="292" font-size="21" font-weight="700" fill="#0d1526">Your phone</text>
  <text x="126" y="316" font-size="14" fill="#5f6b7a">any browser — no app</text>
  <circle cx="140" cy="360" r="13" fill="#e5484d"/>
  <circle cx="174" cy="360" r="13" fill="#30a46c"/>
  <circle cx="208" cy="360" r="13" fill="#3E8EDE"/>
  <circle cx="242" cy="360" r="13" fill="#f5d90a"/>

  <rect x="180" y="450" width="90" height="32" rx="16" fill="#f2f7fd" stroke="#cfe1f7" stroke-width="1.5"/>
  <text x="225" y="471" font-size="14" fill="#1F6FD0" text-anchor="middle">Client</text>

  <!-- the link: the board's own network -->
  <line x1="362" y1="285" x2="686" y2="285" stroke="#bcd8f7" stroke-width="3" stroke-dasharray="2 11" stroke-linecap="round"/>
  <g stroke="#3E8EDE" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M 690 273 A 14 14 0 0 0 690 297"/>
    <path d="M 678 261 A 28 28 0 0 0 678 309"/>
    <path d="M 666 249 A 42 42 0 0 0 666 321"/>
  </g>
  <rect x="435" y="263" width="190" height="44" rx="22" fill="#ffffff" stroke="#cfe1f7" stroke-width="2"/>
  <text x="530" y="291" font-size="15" fill="#1F6FD0" text-anchor="middle">your board’s WiFi</text>
  <text x="530" y="342" font-size="13.5" fill="#5f6b7a" text-anchor="middle">your phone joins it directly — no router</text>

  <!-- your ESP32 -->
  <rect x="700" y="130" width="410" height="310" rx="18" fill="#f2f7fd" stroke="#bcd8f7" stroke-width="2.5"/>
  <g transform="translate(744,176) scale(2.6)" fill="none" stroke="#1F6FD0" stroke-width="0.87" stroke-linecap="round" stroke-linejoin="round">
    <rect width="16" height="16" x="4" y="4" rx="2"/>
    <rect width="6" height="6" x="9" y="9"/>
    <path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/>
    <path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/>
  </g>
  <text x="744" y="292" font-size="21" font-weight="700" fill="#0d1526">Your ESP32</text>
  <text x="744" y="316" font-size="14" fill="#5f6b7a">the server — it serves the page</text>
  <circle cx="766" cy="382" r="21" fill="#e5484d" opacity="0.72"/>
  <circle cx="792" cy="382" r="21" fill="#30a46c" opacity="0.72"/>
  <circle cx="818" cy="382" r="21" fill="#3E8EDE" opacity="0.72"/>
  <text x="858" y="388" font-size="14" fill="#5f6b7a">drives the RGB LED</text>

  <rect x="860" y="450" width="90" height="32" rx="16" fill="#eaf3fd" stroke="#cfe1f7" stroke-width="1.5"/>
  <text x="905" y="471" font-size="14" fill="#1F6FD0" text-anchor="middle">Server</text>
</svg>
