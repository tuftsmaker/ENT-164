<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Your phone joins the robot's own WiFi network, named after your team, and the robot serves the control page.</title>
  <rect width="1200" height="680" fill="#ffffff"/>

  <!-- the phone -->
  <rect x="80" y="80" width="320" height="560" rx="42" fill="#ffffff" stroke="#d5dce7" stroke-width="3"/>
  <rect x="98" y="98" width="284" height="524" rx="30" fill="#0d1526"/>
  <text x="240" y="192" font-size="25" font-weight="700" fill="#ffffff" text-anchor="middle">Robot control</text>
  <text x="240" y="226" font-size="15" fill="#9fb0c9" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">http://192.168.4.1</text>
  <circle cx="196" cy="256" r="6" fill="#4ade80"/>
  <text x="212" y="262" font-size="15" fill="#7ee2a8">connected</text>
  <circle cx="240" cy="395" r="72" fill="#131e33" stroke="#3b4a63" stroke-width="3"/>
  <line x1="240" y1="343" x2="240" y2="323" stroke="#3b4a63" stroke-width="3" stroke-linecap="round"/>
  <line x1="240" y1="447" x2="240" y2="467" stroke="#3b4a63" stroke-width="3" stroke-linecap="round"/>
  <line x1="188" y1="395" x2="168" y2="395" stroke="#3b4a63" stroke-width="3" stroke-linecap="round"/>
  <line x1="292" y1="395" x2="312" y2="395" stroke="#3b4a63" stroke-width="3" stroke-linecap="round"/>
  <circle cx="240" cy="395" r="30" fill="#63ADF2"/>
  <circle cx="240" cy="550" r="52" fill="#16233c" stroke="#63ADF2" stroke-width="2.5"/>
  <text x="240" y="546" font-size="14" font-weight="700" fill="#cfe1f7" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">SERVO</text>
  <text x="240" y="566" font-size="11" fill="#8fa3c0" text-anchor="middle">open / close</text>
  <text x="240" y="608" font-size="13" fill="#5d7186" text-anchor="middle">no app — just the page</text>

  <!-- the link -->
  <line x1="408" y1="300" x2="742" y2="300" stroke="#bcd8f7" stroke-width="3" stroke-dasharray="2 11" stroke-linecap="round"/>
  <g stroke="#3E8EDE" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M 748 288 A 14 14 0 0 0 748 312"/>
    <path d="M 736 277 A 28 28 0 0 0 736 323"/>
    <path d="M 724 266 A 42 42 0 0 0 724 334"/>
  </g>
  <rect x="480" y="279" width="190" height="42" rx="21" fill="#f2f7fd" stroke="#cfe1f7" stroke-width="2"/>
  <text x="575" y="306" font-size="15" fill="#1F6FD0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">YOUR-TEAM-NAME</text>
  <text x="575" y="352" font-size="14" fill="#5f6b7a" text-anchor="middle">the network is named for your team</text>

  <!-- the robot -->
  <g transform="translate(905,330) scale(0.85)">
    <rect x="-118" y="-95" width="32" height="190" rx="16" fill="#262b35"/>
    <rect x="86" y="-95" width="32" height="190" rx="16" fill="#262b35"/>
    <rect x="-74" y="-80" width="148" height="160" rx="16" fill="#f2f7fd" stroke="#bcd8f7" stroke-width="2.5"/>
    <rect x="-36" y="-80" width="72" height="9" rx="4.5" fill="#3E8EDE"/>
    <rect x="-26" y="-28" width="52" height="38" rx="8" fill="#dbe7f6" stroke="#bcd8f7" stroke-width="2"/>
  </g>
  <text x="905" y="474" font-size="21" font-weight="700" fill="#0d1526" text-anchor="middle">Your robot</text>
  <text x="905" y="500" font-size="14.5" fill="#5f6b7a" text-anchor="middle">serves the page on its own network</text>

  <text x="600" y="655" font-size="15" fill="#5f6b7a" text-anchor="middle">No router needed — the page comes from the board itself.</text>
</svg>
