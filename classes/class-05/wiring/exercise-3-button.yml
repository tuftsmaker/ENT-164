# Exercise 3: the 220 Ω circuit with a push button in the path.
board: freenove-esp32-wrover-ext
layout:
  board:
    hidden: true          # no ESP32 in these exercises
  breadboard:
    hidden: false
    cols: 20
    w: 1500
    left_band: 430        # room for the battery pack beside the board

title: Exercise 3. Add a push button
subtitle: The same circuit, with a switch in the path

components:
  - {type: battery_pack, side: left, label_text: "2 x AA pack (3 V)"}
  - {type: resistor, value: "220", from: [2, c], span: 4}
  - {type: led, color: red, at: [6, c]}
  - {type: button, at: [10, b], label_text: button}

wires:
  - {from: bb.rail.top.plus.2, to: bb.2.c, color: red, label: + rail to the resistor}
  - {from: bb.7.c, to: bb.10.e, color: purple, label: to the button}
  - {from: bb.12.b, to: bb.rail.top.minus.12, color: black, label: button to the - rail}

steps:
  - {text: "Resistor 220 Ω from column 2 to column 6, LED in columns 6 and 7, row c."}
  - {text: "Button: its four legs in columns 10 and 12, rows b and e."}
  - {text: "Red jumper: the + rail to column 2. Purple jumper: column 7 to column 10, the button's lower leg."}
  - {text: "Black jumper: column 12, the button's other side, to the - rail."}
  - {text: "Red lead on the + rail, black lead on the - rail. Press the button: the LED lights. Let go: it goes dark."}

notes:
  - {text: "A button has two states, open or closed. On or off. That is a digital signal.", warn: true}
  - "This is exactly what a pin on the board does: it reads a switch, or writes a 3.3 V output."
