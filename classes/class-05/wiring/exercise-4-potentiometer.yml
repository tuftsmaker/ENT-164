# Exercise 4: swap the button for a potentiometer. Turn it to dim the LED.
board: freenove-esp32-wrover-ext
layout:
  board:
    hidden: true          # no ESP32 in these exercises
  breadboard:
    hidden: false
    cols: 20
    w: 1500
    left_band: 430        # room for the battery pack beside the board

title: Exercise 4. Swap in a potentiometer
subtitle: A knob instead of a switch, and the light has a range

components:
  - {type: battery_pack, side: left, label_text: "2 x AA pack (3 V)"}
  - {type: resistor, value: "220", from: [2, c], span: 4}
  - {type: led, color: red, at: [6, c]}
  - {type: potentiometer, at: [10, c], pins: [left, wiper, right]}

wires:
  - {from: bb.rail.top.plus.2, to: bb.2.c, color: red, label: + rail to the resistor}
  - {from: bb.7.c, to: bb.12.c, color: purple, label: to the wiper, the middle leg}
  - {from: bb.10.c, to: bb.rail.top.minus.9, color: black, label: the track's end to the - rail}

steps:
  - {text: "Take the button out. The pack, the resistor and the LED stay."}
  - {text: "Potentiometer: its three legs in columns 10, 12 and 14, row c."}
  - {text: "Purple jumper: column 7 (the LED) to column 12, the middle leg, the wiper."}
  - {text: "Black jumper: column 10, the end of the track, to the - rail."}
  - {text: "Turn the knob. The LED brightens and dims."}

notes:
  - {text: "The middle leg taps the track wherever you turn it, so the resistance is a range, not two states. That is an analogue signal.", warn: true}
  - "A microcontroller reads a voltage like this on an ADC pin, and turns it into a number in your code."
