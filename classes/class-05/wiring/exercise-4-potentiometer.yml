# Exercise 3: swap the button for a potentiometer. Turn it to dim the LED.
board: freenove-esp32-wrover-ext
layout:
  board:
    hidden: true          # no ESP32 in these exercises
  breadboard:
    hidden: false
    cols: 20
    w: 1500

title: Exercise 4. Swap in a potentiometer
subtitle: A knob instead of a switch, and the light has a range

components:
  - {type: module, id: pack, at: [17, a], pins: ["+", "-"], label_text: "2 x AA (3 V)", fill: "#2b2b30", height: 96}
  - {type: resistor, value: "220", from: [2, b], span: 4}
  - {type: led, color: red, at: [6, d]}
  - {type: potentiometer, at: [10, c], pins: [left, wiper, right]}

wires:
  - {from: bb.17.a, to: bb.2.a, color: red, label: pack + to the resistor}
  - {from: bb.7.e, to: bb.10.c, color: purple, label: to the end of the track}
  - {from: bb.11.c, to: bb.18.a, color: black, label: wiper to the pack -}

steps:
  - {text: "Take the button out. The pack, the resistor and the LED stay."}
  - {text: "Potentiometer: three legs in columns 10, 11 and 12, row c."}
  - {text: "Purple jumper: column 7 (the LED) to column 10, the end of the track."}
  - {text: "Black jumper: column 11, the middle leg, to the pack's -."}
  - {text: "Switch the pack on and turn the knob. The LED brightens and dims."}

notes:
  - {text: "The middle leg taps the track wherever you turn it, so the resistance is a range, not two states. That is an analogue signal.", warn: true}
  - "A microcontroller reads a voltage like this on an ADC pin, and turns it into a number in your code."
