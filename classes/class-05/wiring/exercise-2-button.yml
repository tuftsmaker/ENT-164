# Exercise 2: a push button in the same path. Press to light, release to dark.
board: freenove-esp32-wrover-ext
layout:
  breadboard:
    hidden: false

title: Exercise 2. Add a push button
subtitle: The same circuit, with a switch in the path

components:
  - {type: resistor, value: "220", from: [2, b], span: 4}
  - {type: led, color: red, at: [6, d]}
  - {type: button, at: [10, b], label_text: button}

wires:
  - {from: board.L17, to: bb.2.a, color: red, label: 3V3, power in}
  - {from: bb.7.e, to: bb.10.b, color: purple, label: to the button}
  - {from: bb.13.b, to: board.L14, color: black, label: GND}

steps:
  - {text: "The resistor and the LED stay where they are."}
  - {text: "Button: its four legs sit in columns 10 and 13, rows b and c."}
  - {text: "Purple jumper: column 7 (the LED) to column 10 (one side of the button)."}
  - {text: "Black jumper: column 13 (the other side) to GND."}
  - {text: "Press it: the LED lights. Let go: it goes dark."}

notes:
  - {text: "A button has two states, open or closed. On or off. That is a digital signal.", warn: true}
  - "This is exactly what a pin on the board does when it reads a switch, or writes a 3.3 V output."
