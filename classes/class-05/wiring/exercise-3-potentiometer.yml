# Exercise 3: swap the button for a potentiometer. Turn it to dim the LED.
board: freenove-esp32-wrover-ext
layout:
  breadboard:
    hidden: false

title: Exercise 3. Swap in a potentiometer
subtitle: A knob instead of a switch, and the light has a range

components:
  - {type: resistor, value: "220", from: [2, b], span: 4}
  - {type: led, color: red, at: [6, d]}
  - {type: potentiometer, at: [10, c], pins: [left, wiper, right]}

wires:
  - {from: board.L17, to: bb.2.a, color: red, label: 3V3, power in}
  - {from: bb.7.e, to: bb.10.c, color: purple, label: to the end of the track}
  - {from: bb.11.c, to: board.L14, color: black, label: wiper to GND}

steps:
  - {text: "Take the button out. The resistor and the LED stay."}
  - {text: "Potentiometer: three legs in columns 10, 11 and 12, row c."}
  - {text: "Purple jumper: column 7 (the LED) to column 10, the end of the track."}
  - {text: "Black jumper: column 11, the middle leg, to GND."}
  - {text: "Turn the knob. The LED brightens and dims."}

notes:
  - {text: "The middle leg taps the track wherever you turn it, so the resistance is a range, not two states. That is an analogue signal.", warn: true}
  - "A microcontroller reads a voltage like this on an ADC pin. On the ESP32, that is GPIO 34 or 35."
