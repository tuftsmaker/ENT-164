# Exercise 1: the LED straight across the rails, with no resistor at all.
board: freenove-esp32-wrover-ext
layout:
  board:
    hidden: true          # no ESP32 in these exercises
  breadboard:
    hidden: false
    cols: 20
    w: 1500
    left_band: 430        # room for the battery pack beside the board

title: Exercise 1. An LED with no resistor
subtitle: On for a second, to see how bright it gets

components:
  - {type: battery_pack, side: left, label_text: "2 x AA pack (3 V)"}
  - {type: led, color: red, at: [6, c]}

wires:
  - {from: bb.rail.top.plus.6, to: bb.6.c, color: red, label: + rail to the LED}
  - {from: bb.7.c, to: bb.rail.top.minus.7, color: black, label: LED to the - rail}

steps:
  - {text: "Pack at the left, its two leads onto the + and - rails along the top."}
  - {text: "LED: long leg in column 6 row c, short leg in column 7 row c."}
  - {text: "Red jumper: the + rail to column 6. Black jumper: column 7 to the - rail."}
  - {text: "Red lead on the + rail, black lead on the - rail. Only for a second, then pull the red lead back out."}
  - {text: "Take it apart and build exercise 2. That is the safe version."}

notes:
  - {text: "No resistor means nothing sets the current. The LED is overdriven and can burn out. Do not leave it connected.", warn: true}
  - "This is what the resistor is for. It turns the same circuit into one that lasts."
