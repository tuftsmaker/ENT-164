# What this class covers. The Canvas class page's "What we'll cover"
# cards: a reading of the deck, one brief line per topic. The page is
# generated from these, so edit here rather than in Canvas.
hero: "shots/weather-station-cover.jpg"
hero_alt: "An illustrated weather station on a wooden post, with a dashed link through the internet cloud to a laptop showing its readings on a web page"

topics:
  - title: "Wire the sensor"
    learn: "A DHT22 on the ESP32. opencode chooses the data pin; you check the wiring."
  - title: "Serve it"
    learn: "A tiny web server on the board answers GET /device/readings, so a browser can check the sensor."
  - title: "Upload it"
    learn: "One POST to a Vercel app, and one row per reading in Postgres."
  - title: "Show it"
    learn: "A page with the newest reading, plus five days of forecast from a weather API."
  - title: "Control it"
    learn: "A threshold set on the page that turns on an LED when the room passes it."
