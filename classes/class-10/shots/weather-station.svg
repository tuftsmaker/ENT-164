<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1050" viewBox="0 0 900 1050" role="img"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A weather station with an anemometer, wind vane, temperature sensor and rain gauge, sending its readings to a browser window below.</title>
  <rect width="900" height="1050" fill="#ffffff"/>

  <!-- ground -->
  <line x1="250" y1="620" x2="700" y2="620" stroke="#d5dce7" stroke-width="4" stroke-linecap="round"/>
  <line x1="286" y1="620" x2="278" y2="600" stroke="#d5dce7" stroke-width="4" stroke-linecap="round"/>
  <line x1="308" y1="620" x2="306" y2="598" stroke="#d5dce7" stroke-width="4" stroke-linecap="round"/>
  <line x1="672" y1="620" x2="678" y2="600" stroke="#d5dce7" stroke-width="4" stroke-linecap="round"/>

  <!-- mast -->
  <line x1="430" y1="620" x2="430" y2="150" stroke="#3E8EDE" stroke-width="7" stroke-linecap="round"/>
  <line x1="388" y1="620" x2="472" y2="620" stroke="#1F6FD0" stroke-width="9" stroke-linecap="round"/>

  <!-- anemometer -->
  <line x1="430" y1="150" x2="430" y2="82" stroke="#3E8EDE" stroke-width="5" stroke-linecap="round"/>
  <line x1="430" y1="150" x2="489" y2="184" stroke="#3E8EDE" stroke-width="5" stroke-linecap="round"/>
  <line x1="430" y1="150" x2="371" y2="184" stroke="#3E8EDE" stroke-width="5" stroke-linecap="round"/>
  <circle cx="430" cy="82" r="14" fill="#ffffff" stroke="#3E8EDE" stroke-width="5"/>
  <circle cx="489" cy="184" r="14" fill="#ffffff" stroke="#3E8EDE" stroke-width="5"/>
  <circle cx="371" cy="184" r="14" fill="#ffffff" stroke="#3E8EDE" stroke-width="5"/>
  <circle cx="430" cy="150" r="10" fill="#1F6FD0"/>

  <!-- wind vane -->
  <line x1="368" y1="270" x2="494" y2="270" stroke="#3E8EDE" stroke-width="5" stroke-linecap="round"/>
  <path d="M494 270 L470 259 L470 281 Z" fill="#1F6FD0"/>
  <path d="M368 270 L388 257 L388 283 Z" fill="#ffffff" stroke="#3E8EDE" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="430" cy="270" r="8" fill="#1F6FD0"/>

  <!-- temperature and humidity sensor -->
  <line x1="430" y1="384" x2="464" y2="384" stroke="#3E8EDE" stroke-width="5" stroke-linecap="round"/>
  <rect x="462" y="312" width="108" height="144" rx="12" fill="#ffffff" stroke="#3E8EDE" stroke-width="5"/>
  <rect x="474" y="324" width="84" height="54" rx="7" fill="#eaf3fd" stroke="#cfe1f7" stroke-width="2"/>
  <text x="516" y="364" font-size="28" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        fill="#1F6FD0" text-anchor="middle">8.4°</text>
  <line x1="478" y1="400" x2="554" y2="400" stroke="#cfe1f7" stroke-width="4" stroke-linecap="round"/>
  <line x1="478" y1="418" x2="554" y2="418" stroke="#cfe1f7" stroke-width="4" stroke-linecap="round"/>
  <line x1="478" y1="436" x2="554" y2="436" stroke="#cfe1f7" stroke-width="4" stroke-linecap="round"/>

  <!-- rain gauge -->
  <line x1="400" y1="512" x2="430" y2="512" stroke="#3E8EDE" stroke-width="5" stroke-linecap="round"/>
  <path d="M336 470 L404 470 L380 506 L360 506 Z" fill="#ffffff" stroke="#3E8EDE" stroke-width="5" stroke-linejoin="round"/>
  <rect x="350" y="506" width="40" height="70" rx="7" fill="#ffffff" stroke="#3E8EDE" stroke-width="5"/>
  <rect x="354" y="534" width="32" height="38" rx="4" fill="#eaf3fd"/>

  <!-- the reading goes to the page -->
  <path d="M572 336 C 700 366, 762 500, 762 680" fill="none" stroke="#bcd8f7" stroke-width="5"
        stroke-linecap="round" stroke-dasharray="2 13"/>
  <path d="M751 672 L762 686 L773 672" fill="none" stroke="#bcd8f7" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the page -->
  <rect x="110" y="700" width="680" height="300" rx="18" fill="#ffffff" stroke="#d5dce7" stroke-width="4"/>
  <line x1="110" y1="752" x2="790" y2="752" stroke="#e6eaf1" stroke-width="3"/>
  <circle cx="140" cy="726" r="6" fill="#cfe1f7"/>
  <circle cx="162" cy="726" r="6" fill="#cfe1f7"/>
  <circle cx="184" cy="726" r="6" fill="#cfe1f7"/>
  <rect x="212" y="712" width="320" height="28" rx="14" fill="#f7f9fc" stroke="#e6eaf1" stroke-width="2"/>
  <text x="372" y="732" font-size="15" fill="#5f6b7a" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">weather.example.com</text>

  <text x="150" y="792" font-size="15" fill="#5f6b7a" letter-spacing="2.4">MEDFORD · STATION 01</text>
  <text x="150" y="866" font-size="62" font-weight="600" fill="#0d1526">8.4 °C</text>
  <text x="150" y="908" font-size="17" fill="#5f6b7a">Humidity 48% · Wind 12 km/h</text>

  <!-- sparkline -->
  <line x1="470" y1="800" x2="470" y2="930" stroke="#e6eaf1" stroke-width="3"/>
  <line x1="470" y1="930" x2="750" y2="930" stroke="#e6eaf1" stroke-width="3"/>
  <polyline points="470,900 502,882 534,892 566,862 598,872 630,842 662,852 694,820 726,830 750,806"
            fill="none" stroke="#3E8EDE" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="750" cy="806" r="7" fill="#1F6FD0"/>
  <text x="470" y="958" font-size="13" fill="#8a93a3">last 12 hours</text>
</svg>
