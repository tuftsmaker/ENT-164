board: freenove-esp32-wrover-ext

title: DHT22 temperature and humidity sensor
subtitle: Three jumpers — 3V3, DATA on GPIO 4, and ground

layout:
  breadboard:
    hidden: false

components:
  - type: dht22
    at: [10, c]

wires:
  - {from: bb.10.c, to: board.L1, color: red, label: 3V3}
  - {from: bb.11.c, to: board.R13, color: orange, label: signal — GPIO 4}
  - {from: bb.12.c, to: board.R17, color: black, label: ground — GND}

steps:
  - text: "VCC lands in column 10, DATA in 11, GND in 12."
  - text: "Red jumper: 3V3 to column 10. Orange: GPIO 4 to column 11. Black: GND to column 12."

notes:
  - "The module has the pull-up resistor built in. The bare four-pin sensor needs 10 kΩ between VCC and DATA."
  - text: "3.3 V, not 5 V — the ESP32 pins are not 5 V tolerant. And read it no faster than every two seconds."
    warn: true
