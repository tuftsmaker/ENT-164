<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="380" viewBox="20 110 1160 380" role="img"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A browser asks a server for a page or data, the server reads or writes a database, and the answer comes back to the browser.</title>
  <rect width="1200" height="600" fill="#ffffff"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3E8EDE"/>
    </marker>
  </defs>

  <!-- browser -->
  <rect x="50" y="170" width="300" height="260" rx="18" fill="#ffffff" stroke="#e6eaf1" stroke-width="2.5"/>
  <g transform="translate(88,200)" fill="none" stroke="#3E8EDE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="66" height="50" rx="6"/>
    <line x1="0" y1="16" x2="66" y2="16"/>
    <circle cx="10" cy="8" r="1.8" fill="#3E8EDE" stroke="none"/>
    <circle cx="18" cy="8" r="1.8" fill="#3E8EDE" stroke="none"/>
  </g>
  <text x="88" y="310" font-size="24" font-weight="700" fill="#0d1526">Browser</text>
  <text x="88" y="336" font-size="14.5" fill="#5f6b7a">the client</text>
  <text x="88" y="378" font-size="13.5" fill="#3f4a5a">It asks for a page</text>
  <text x="88" y="400" font-size="13.5" fill="#3f4a5a">and draws the answer</text>

  <!-- server -->
  <rect x="450" y="140" width="300" height="320" rx="18" fill="#f2f7fd" stroke="#bcd8f7" stroke-width="2.5"/>
  <g transform="translate(488,176)" fill="none" stroke="#1F6FD0" stroke-width="2.6" stroke-linecap="round">
    <rect width="58" height="18" rx="4"/>
    <rect y="26" width="58" height="18" rx="4"/>
    <rect y="52" width="58" height="18" rx="4"/>
    <line x1="10" y1="9" x2="17" y2="9"/>
    <line x1="10" y1="35" x2="17" y2="35"/>
    <line x1="10" y1="61" x2="17" y2="61"/>
    <circle cx="45" cy="9" r="2.2" fill="#1F6FD0" stroke="none"/>
    <circle cx="45" cy="35" r="2.2" fill="#1F6FD0" stroke="none"/>
    <circle cx="45" cy="61" r="2.2" fill="#1F6FD0" stroke="none"/>
  </g>
  <text x="488" y="300" font-size="24" font-weight="700" fill="#0d1526">Server</text>
  <text x="488" y="326" font-size="14.5" fill="#5f6b7a">a computer that answers</text>
  <text x="488" y="368" font-size="13.5" fill="#3f4a5a">Sends files, runs code</text>
  <text x="488" y="390" font-size="13.5" fill="#3f4a5a">and asks the database</text>

  <!-- database -->
  <rect x="850" y="170" width="300" height="260" rx="18" fill="#ffffff" stroke="#e6eaf1" stroke-width="2.5"/>
  <g transform="translate(888,198)" fill="none" stroke="#3E8EDE" stroke-width="3" stroke-linecap="round">
    <ellipse cx="30" cy="10" rx="30" ry="10"/>
    <path d="M0 10 V70 A30 10 0 0 0 60 70 V10"/>
    <path d="M0 36 A30 10 0 0 0 60 36"/>
  </g>
  <text x="888" y="310" font-size="24" font-weight="700" fill="#0d1526">Database</text>
  <text x="888" y="336" font-size="14.5" fill="#5f6b7a">the part that remembers</text>
  <text x="888" y="378" font-size="13.5" fill="#3f4a5a">Keeps data after the</text>
  <text x="888" y="400" font-size="13.5" fill="#3f4a5a">server is switched off</text>

  <!-- browser <-> server -->
  <line x1="352" y1="240" x2="446" y2="240" stroke="#3E8EDE" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
  <rect x="353" y="188" width="92" height="28" rx="14" fill="#ffffff" stroke="#cfe1f7" stroke-width="1.5"/>
  <text x="399" y="207" font-size="12.5" fill="#1F6FD0" text-anchor="middle">request</text>

  <line x1="448" y1="352" x2="354" y2="352" stroke="#3E8EDE" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
  <rect x="353" y="376" width="92" height="28" rx="14" fill="#ffffff" stroke="#cfe1f7" stroke-width="1.5"/>
  <text x="399" y="395" font-size="12.5" fill="#1F6FD0" text-anchor="middle">response</text>

  <!-- server <-> database -->
  <line x1="752" y1="240" x2="846" y2="240" stroke="#3E8EDE" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
  <rect x="753" y="188" width="92" height="28" rx="14" fill="#ffffff" stroke="#cfe1f7" stroke-width="1.5"/>
  <text x="799" y="207" font-size="12.5" fill="#1F6FD0" text-anchor="middle">query</text>

  <line x1="848" y1="352" x2="754" y2="352" stroke="#3E8EDE" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
  <rect x="753" y="376" width="92" height="28" rx="14" fill="#ffffff" stroke="#cfe1f7" stroke-width="1.5"/>
  <text x="799" y="395" font-size="12.5" fill="#1F6FD0" text-anchor="middle">rows</text>
</svg>
