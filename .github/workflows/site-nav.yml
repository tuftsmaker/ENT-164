name: Site nav

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "assets/site.css"
      - "assets/guide.css"
      - "tools/site-nav/**"
      - "tools/skill-tasks/catalog/**"
      - "requirements.txt"
      - ".github/workflows/site-nav.yml"
  pull_request:
    paths:
      - "**/*.html"
      - "assets/site.css"
      - "assets/guide.css"
      - "tools/site-nav/**"
      - "tools/skill-tasks/catalog/**"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the checks' dependencies
        run: python3 -m pip install -r requirements.txt
      - name: The main nav on every page matches the shared spec
        run: python3 tools/site-nav/apply.py --check
      - name: The generated task pages match their builder
        run: python3 tools/skill-tasks/catalog/build.py --check
      - name: Every nav link resolves, and every sub-nav anchor exists
        run: python3 tools/site-nav/verify-links.py
      - name: The nav actually renders (real browser, two widths)
        run: python3 tools/site-nav/verify-render.py
