name: Slides in sync

on:
  push:
    branches: [main]
    paths:
      - "classes/**"
      - "syllabus/**"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/slides-sync.yml"
  pull_request:
    paths:
      - "classes/**"
      - "syllabus/**"
      - "assets/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify each class PDF matches its slide sources
        run: ./scripts/build-class.sh --check --all
      - name: Verify the syllabus PDF matches syllabus/index.html
        run: ./scripts/build-syllabus.sh --check
